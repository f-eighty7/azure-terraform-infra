name: "Terraform Destroy"

on:
    workflow_dispatch:
        inputs:
            confirmation:
                description: 'Skriv "destroy" för att bekräfta rivning av infrastrukturen'
                required: true
                type: string
                default: ""

permissions:
    id-token: write
    contents: read

concurrency: terraform

defaults:
    run:
        shell: bash
        working-directory: ./terraform

jobs:
    destroy:
        name: "Terraform Destroy"
        runs-on: ubuntu-latest

        steps:
            - name: "Validera bekräftelse"
              run: |
                  if [ "${{ github.event.inputs.confirmation }}" != "destroy" ]; then
                    echo "Fel: Bekräftelsesträngen matchar inte 'destroy'. Avbryter körningen för att skydda infrastrukturen."
                    exit 1
                  fi

            - name: "Checkout Repository"
              uses: actions/checkout@v7

            - name: "Konfigurera SSH Public Key"
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
                  chmod 644 ~/.ssh/id_rsa.pub

            - name: "Installera Terraform"
              uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: "1.16.1"

            - name: "Logga in på Azure via OIDC"
              uses: azure/login@v3
              with:
                  client-id: ${{ vars.ARM_CLIENT_ID }}
                  tenant-id: ${{ vars.ARM_TENANT_ID }}
                  subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

            - name: "Exportera Terraform Azure-miljövariabler"
              run: |
                  echo "ARM_CLIENT_ID=${{ vars.ARM_CLIENT_ID }}" >> $GITHUB_ENV
                  echo "ARM_TENANT_ID=${{ vars.ARM_TENANT_ID }}" >> $GITHUB_ENV
                  echo "ARM_SUBSCRIPTION_ID=${{ vars.ARM_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
                  echo "ARM_USE_OIDC=true" >> $GITHUB_ENV
                  echo "ARM_USE_AZUREAD=true" >> $GITHUB_ENV

            - name: "Terraform Init"
              id: init
              run: terraform init

            - name: "Terraform Destroy"
              id: destroy
              run: terraform destroy -auto-approve -input=false
