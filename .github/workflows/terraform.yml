name: "Terraform CI/CD"

on:
    push:
        branches:
            - main
        paths:
            - "terraform/**"
            - ".github/workflows/terraform.yml"
    pull_request:
        branches:
            - main
        paths:
            - "terraform/**"
            - ".github/workflows/terraform.yml"
    workflow_dispatch:

permissions:
    id-token: write
    contents: read
    pull-requests: write

concurrency: terraform

defaults:
    run:
        shell: bash
        working-directory: ./terraform

jobs:
    terraform:
        name: "Terraform Lint, Plan & Apply"
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout Repository"
              uses: actions/checkout@v7

            - name: "Konfigurera SSH Public Key"
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
                  chmod 644 ~/.ssh/id_rsa.pub

            - name: "Installera Terraform"
              uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: "1.16.1"

            - name: "Logga in på Azure via OIDC"
              uses: azure/login@v3
              with:
                  client-id: ${{ vars.ARM_CLIENT_ID }}
                  tenant-id: ${{ vars.ARM_TENANT_ID }}
                  subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

            - name: "Exportera Terraform Azure-miljövariabler"
              run: |
                  echo "ARM_CLIENT_ID=${{ vars.ARM_CLIENT_ID }}" >> $GITHUB_ENV
                  echo "ARM_TENANT_ID=${{ vars.ARM_TENANT_ID }}" >> $GITHUB_ENV
                  echo "ARM_SUBSCRIPTION_ID=${{ vars.ARM_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
                  echo "ARM_USE_OIDC=true" >> $GITHUB_ENV
                  echo "ARM_USE_AZUREAD=true" >> $GITHUB_ENV

            - name: "Terraform Format Check"
              id: fmt
              run: terraform fmt -check -recursive

            - name: "Terraform Init"
              id: init
              run: terraform init

            - name: "Terraform Validate"
              id: validate
              run: terraform validate

            - name: "Terraform Plan"
              id: plan
              if: github.event_name == 'pull_request'
              run: terraform plan -no-color -input=false

            - name: "Terraform Apply"
              if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              run: terraform apply -auto-approve -input=false
